<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1400">
<title>GAM – Enrichment Workspace v2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:14px;color:#1e293b;background:#f1f5f9;overflow:hidden;height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
@keyframes fi{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes si{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.app{display:flex;height:100vh}

/* Sidebar */
.sb{width:232px;background:#1a365d;color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.sb-hdr{padding:16px 18px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-hdr h2{font-size:1.02em;font-weight:700;letter-spacing:.03em;margin:0}
.sb-hdr small{font-size:.7em;color:#94a3b8}
.sb-nav{flex:1;overflow-y:auto;padding:10px 0}
.sb-section{padding:10px 18px 5px;font-size:.66em;font-weight:700;color:#64748b;letter-spacing:.08em}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 18px;border:none;background:transparent;color:#cbd5e1;cursor:pointer;font-size:.84em;text-align:left;border-left:3px solid transparent;transition:all .15s;font-family:inherit}
.sb-item:hover{background:rgba(255,255,255,.06)}
.sb-item.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:#6ee7b7}
.sb-item .ic{width:18px;text-align:center}
.sb-item .lb{flex:1}
.sb-badge{background:rgba(255,255,255,.15);padding:1px 7px;border-radius:10px;font-size:.76em;font-weight:600}
.sb-badge.alert{background:#dc2626;animation:pulse 2s infinite}
.sb-footer{padding:10px 18px;border-top:1px solid rgba(255,255,255,.1);font-size:.73em;color:#64748b}

/* Main area */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-bar{padding:10px 22px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between}
.top-bar h1{font-size:1.05em;font-weight:700;margin:0;display:flex;align-items:center;gap:10px}
.version{font-size:.7em;color:#94a3b8;font-weight:400;background:#f1f5f9;padding:2px 8px;border-radius:10px}
.top-bar .meta{font-size:.76em;color:#94a3b8}
.stm-filter{font-size:.78em;color:#64748b}
.stm-filter a{color:#3b82f6;cursor:pointer;text-decoration:underline;border:none;background:none;font-size:inherit;font-family:inherit}
.content{flex:1;overflow:auto}

/* Tabs */
.tabs{display:flex;gap:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:0 22px}
.tab{padding:10px 18px;font-size:.84em;font-weight:600;color:#64748b;border-bottom:2px solid transparent;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:7px}
.tab:hover{color:#1a365d}
.tab.active{color:#1a365d;border-bottom-color:#1a365d}
.tab .tab-count{font-size:.78em;background:#f1f5f9;padding:1px 7px;border-radius:8px;font-weight:400}
.tab.active .tab-count{background:#e0e7ff;color:#1a365d}

/* Summary panel */
.summary{background:#fff;border-bottom:1px solid #e2e8f0;padding:0}
.summary-inner{padding:14px 22px;transition:max-height .25s ease,opacity .2s ease,padding .25s ease;overflow:hidden}
.summary-inner.collapsed{max-height:0 !important;opacity:0;padding-top:0;padding-bottom:0}
.summary-toggle{display:flex;align-items:center;gap:8px;padding:7px 22px;cursor:pointer;user-select:none;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.summary-toggle:hover{background:#fafbfc}
.summary-toggle .st-label{font-size:.76em;font-weight:700;color:#64748b;letter-spacing:.04em;text-transform:uppercase;flex:1}
.summary-toggle .st-arrow{font-size:.8em;color:#94a3b8;transition:transform .2s}
.summary-toggle .st-arrow.up{transform:rotate(180deg)}
.summary-toggle .st-mini{display:flex;gap:14px;font-size:.74em;color:#94a3b8}
.summary-toggle .st-mini span{display:flex;align-items:center;gap:4px}
.summary-toggle .st-mini .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.summary-title{font-size:.78em;font-weight:700;color:#64748b;margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase}
.summary-hint{margin-top:6px;font-size:.74em;color:#94a3b8;font-style:italic}
.summary-cards{display:flex;gap:12px;margin-bottom:12px}
.s-card{flex:1;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px 16px}
.s-card .s-label{font-size:.68em;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.s-card .s-val{font-size:1.4em;font-weight:700;color:#1a365d;margin:4px 0 0}
.s-card .s-sub{font-size:.72em;color:#94a3b8}
.s-card.green .s-val{color:#16a34a}
.s-card.amber .s-val{color:#d97706}
.s-card.red .s-val{color:#dc2626}

/* Toolbar */
.toolbar{padding:9px 22px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.toolbar .sep{width:1px;height:22px;background:#e2e8f0}
.toolbar .spacer{flex:1}
.sel-info{font-size:.76em;color:#64748b;padding:3px 9px;background:#f1f5f9;border-radius:4px}
.tb-group{display:flex;align-items:center;gap:4px;position:relative}
.tb-dropdown{position:absolute;top:100%;left:0;background:#fff;border:1px solid #e2e8f0;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:100;min-width:220px;padding:4px 0;margin-top:4px}
.tb-dropdown .dd-item{padding:8px 14px;font-size:.82em;cursor:pointer;display:flex;align-items:center;gap:8px;color:#334155}
.tb-dropdown .dd-item:hover{background:#f1f5f9}
.tb-dropdown .dd-item .dd-ic{width:18px;text-align:center;color:#64748b}
.tb-dropdown .dd-sep{height:1px;background:#e2e8f0;margin:4px 0}

/* Filters */
.filters{padding:7px 22px;background:#fafbfc;border-bottom:1px solid #f1f5f9;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filters label{font-size:.73em;color:#94a3b8;font-weight:600}
.filters select,.filters input{font-size:.8em;padding:3px 7px;border:1px solid #e2e8f0;border-radius:4px;font-family:inherit}
.filters input{width:130px}
.filter-active{border-color:#3b82f6 !important;background:#eff6ff !important}

/* Tables */
table{width:100%;border-collapse:collapse}
th{padding:7px 9px;font-size:.72em;color:#64748b;border-bottom:2px solid #e2e8f0;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;background:#f8fafc;z-index:1}
td{padding:6px 9px;font-size:.85em;border-bottom:1px solid #f1f5f9}
.r{text-align:right}
.c{text-align:center}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:#fafbfc}
tr.selected{background:#eff6ff !important}

/* Badges */
.st-badge{padding:2px 10px;border-radius:12px;font-size:.79em;font-weight:500;white-space:nowrap;display:inline-block}
.st-badge.bold{font-weight:700}
.st-badge.strike{text-decoration:line-through}
.conf-badge{padding:2px 8px;border-radius:8px;font-size:.75em;font-weight:500;white-space:nowrap;display:inline-block}
.origin-badge{padding:2px 8px;border-radius:8px;font-size:.75em;font-weight:600;display:inline-block}
.src-badge{font-weight:600;font-size:.8em;padding:1px 6px;border-radius:3px;display:inline-block}
.type-badge{font-weight:600;font-size:.78em;padding:2px 8px;border-radius:4px;display:inline-block;background:#f1f5f9;color:#334155}
.type-badge.loan{background:#fef3c7;color:#92400e}
.type-badge.fund{background:#dbeafe;color:#1e40af}
.type-badge.sec{background:#e0e7ff;color:#3730a3}
.type-badge.fee{background:#fce7f3;color:#9d174d}
.type-badge.fx{background:#d1fae5;color:#065f46}
.dc-d{color:#C62828;font-weight:700;font-family:monospace;font-size:.87em}
.dc-c{color:#2E7D32;font-weight:700;font-family:monospace;font-size:.87em}
.dc-n{color:#64748b;font-weight:700;font-family:monospace;font-size:.87em}
.amt{font-family:monospace;font-size:.85em}
.amt.bold{font-weight:700}
.amt.neg{color:#C62828}
.missing{color:#dc2626}
.link-cell{color:#1a365d;text-decoration:underline;text-decoration-color:#cbd5e1;cursor:pointer}
.err-row td{font-size:.78em;color:#C62828;font-style:italic;border-bottom:1px solid #fecaca;padding:3px 9px 7px}
.muted{color:#94a3b8}
.mono{font-family:monospace}
.warn-row td{font-size:.78em;color:#d97706;font-style:italic;padding:3px 9px 7px}

/* Row tinting */
.row-error{background:#FFF5F5}
.row-manual_review{background:#FFFDE7}
.row-ready{background:#F1F8E9}
.row-paired{background:#f5f5ff}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:5px;border:1px solid #cbd5e1;background:#fff;color:#334155;font-weight:600;font-size:.83em;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .12s}
.btn:hover:not(:disabled){filter:brightness(.97)}
.btn:disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed;border-color:#e2e8f0}
.btn.primary{background:#1a365d;color:#fff;border:none}
.btn.success{background:#16a34a;color:#fff;border:none}
.btn.danger{background:#dc2626;color:#fff;border:none}
.btn.warn{background:#d97706;color:#fff;border:none}
.btn.sm{padding:5px 11px;font-size:.77em}
.btn.xs{padding:3px 8px;font-size:.73em}
.btn .ic{font-size:1.05em}
.btn-ghost{background:none;border:none;color:#3b82f6;font-weight:600;font-size:.82em;cursor:pointer;padding:4px 8px;border-radius:4px;font-family:inherit}
.btn-ghost:hover{background:#eff6ff}

/* Pagination */
.pagination{padding:8px 22px;background:#fff;border-top:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;font-size:.8em;color:#64748b}
.pagination select{font-size:.88em;padding:1px 5px;border:1px solid #e2e8f0;border-radius:3px}
.pg-btn{border:1px solid #e2e8f0;background:#fff;border-radius:3px;padding:1px 7px;color:#94a3b8;cursor:pointer}

/* Card wrapper */
.card{background:#fff;border-radius:8px;border:1px solid #e2e8f0;overflow:hidden;margin:0}
.card-bar{padding:9px 14px;border-bottom:1px solid #e2e8f0;display:flex;gap:7px;align-items:center}
.card-info{padding:9px 14px;border-bottom:1px solid #e2e8f0;font-size:.8em;color:#64748b;font-style:italic}
.card-body{overflow:auto}

/* Overlay / dialogs */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.48);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.18);max-width:760px;width:100%;max-height:84vh;overflow:auto}
.dialog.wide{max-width:920px}
.dlg-hdr{padding:14px 20px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.dlg-hdr h3{margin:0;font-size:.98em;font-weight:600;display:flex;align-items:center;gap:8px}
.dlg-close{background:none;border:none;font-size:17px;color:#94a3b8;cursor:pointer}
.dlg-body{padding:20px}
.dlg-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}
.info-box{background:#f8fafc;border-radius:6px;padding:12px;margin-bottom:14px;font-size:.86em}
.info-box.warn{background:#fffbeb;border:1px solid #fde68a}
.info-box.success{background:#f0fdf4;border:1px solid #bbf7d0}
.info-box.info{background:#eff6ff;border:1px solid #bfdbfe}
.info-row{display:flex;gap:16px;flex-wrap:wrap}
.info-row span.lbl{color:#64748b}

/* Slide-over form panel */
.slide-over{position:fixed;inset:0;z-index:900;display:flex}
.slide-bg{flex:1;background:rgba(15,23,42,.3);backdrop-filter:blur(2px);cursor:pointer}
.slide-panel{width:620px;background:#fff;box-shadow:-6px 0 36px rgba(0,0,0,.1);overflow:auto;animation:si .2s ease;display:flex;flex-direction:column}
.slide-hdr{padding:14px 20px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;background:#f8fafc;position:sticky;top:0;z-index:2}
.slide-hdr .meta{font-size:.74em;color:#64748b}
.slide-hdr h2{margin:1px 0 0;font-size:.96em;font-weight:700}
.slide-body{flex:1;padding:0 20px 18px;overflow:auto}
.slide-footer{padding:12px 20px;border-top:1px solid #e2e8f0;display:flex;gap:7px;justify-content:space-between;background:#f8fafc;position:sticky;bottom:0;z-index:2}

/* Operation actions in slide panel */
.op-bar{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #e2e8f0;margin-bottom:4px}
.op-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;font-size:.78em;font-weight:500;cursor:pointer;color:#334155;font-family:inherit;transition:all .12s}
.op-btn:hover{background:#f1f5f9;border-color:#cbd5e1}
.op-btn .op-ic{font-size:1.1em}
.op-btn.highlight{border-color:#3b82f6;background:#eff6ff;color:#1a365d}

/* Form sections */
.f-section{margin-top:14px}
.f-section-hdr{display:flex;align-items:center;gap:7px;width:100%;background:none;border:none;border-bottom:2px solid #e2e8f0;padding:7px 0 5px;cursor:pointer;text-align:left;font-family:inherit}
.f-section-hdr .num{font-size:.68em;color:#94a3b8;font-weight:700;background:#f1f5f9;padding:1px 5px;border-radius:3px}
.f-section-hdr .title{font-size:.86em;font-weight:700;color:#1e293b;flex:1}
.f-section-hdr .toggle{color:#94a3b8;font-size:.8em}
.f-section-body{padding:8px 0 2px}
.f-row{display:flex;gap:12px;margin-bottom:7px;flex-wrap:wrap}
.f-field{flex:1 1 28%;min-width:110px}
.f-field.wide{flex:1 1 100%;min-width:200px}
.f-field label{display:block;font-size:.68em;color:#64748b;font-weight:600;margin-bottom:2px}
.f-field .val{font-size:.86em;padding:4px 0}
.f-field .val.muted{color:#94a3b8}
.f-field input[type=text],.f-field select,.f-field textarea{width:100%;font-size:.86em;padding:4px 7px;border:1px solid #e2e8f0;border-radius:4px;font-family:inherit}
.f-field input.highlight{border:2px solid #f59e0b;background:#FFFDE7}
.f-field .err-val{font-size:.83em;color:#C62828;padding:5px 8px;background:#FFF5F5;border-radius:4px;border:1px solid #fecaca}

/* Toast */
.toast{position:fixed;top:16px;right:16px;background:#1a365d;color:#fff;padding:10px 20px;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);z-index:9999;font-size:.86em;display:flex;align-items:center;gap:9px;animation:fi .25s ease}
.toast .check{color:#6ee7b7}
.toast button{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:14px;margin-left:8px}

.placeholder{padding:36px;text-align:center;color:#94a3b8}
.placeholder .big-icon{font-size:42px;margin-bottom:10px}
.hidden{display:none}

/* Grid for dialog forms */
.dlg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:16px}
.dlg-grid .span2{grid-column:span 2}
.dlg-grid .span3{grid-column:span 3}
.dlg-grid label{display:block;font-size:.72em;color:#64748b;font-weight:600;margin-bottom:2px}
.dlg-grid input,.dlg-grid select,.dlg-grid textarea{width:100%;font-size:.86em;padding:4px 7px;border:1px solid #e2e8f0;border-radius:4px;font-family:inherit}
.dlg-grid textarea{height:70px;resize:vertical}

.recon-note{font-size:.8em;color:#64748b;margin-bottom:18px;font-style:italic}
.green{color:#16a34a;font-weight:600}
.red{color:#dc2626;font-weight:600}
.amber{color:#d97706;font-weight:600}
.split-sum{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;background:#f8fafc;border-radius:6px;font-size:.82em;margin-bottom:14px}
.add-row-btn{font-size:.8em;color:#3b82f6;background:none;border:none;cursor:pointer;margin-bottom:14px;font-family:inherit}

/* Variance indicator */
.var-ind{display:inline-flex;align-items:center;gap:4px;font-size:.78em;font-weight:600;padding:3px 8px;border-radius:4px}
.var-ind.ok{background:#f0fdf4;color:#16a34a}
.var-ind.warn{background:#fffbeb;color:#d97706}
.var-ind.err{background:#fef2f2;color:#dc2626}

/* Loan contract card */
.contract-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px;margin:10px 0}
.contract-card .cc-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.contract-card .cc-title{font-weight:700;font-size:.88em;color:#1a365d}
.contract-card .cc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 14px}
.contract-card .cc-field{font-size:.78em}
.contract-card .cc-field .cc-lbl{color:#64748b;font-size:.88em}
.contract-card .cc-field .cc-val{font-weight:600;color:#1e293b}

/* Fund allocation table */
.alloc-table{width:100%;border-collapse:collapse;margin:10px 0}
.alloc-table th{font-size:.7em;padding:6px 8px;background:#f1f5f9}
.alloc-table td{font-size:.82em;padding:5px 8px;border-bottom:1px solid #f1f5f9}
.alloc-table .total-row{border-top:2px solid #e2e8f0;font-weight:700}

/* Quick action chips */
.action-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border:1px solid #e2e8f0;border-radius:16px;font-size:.74em;color:#475569;cursor:pointer;font-family:inherit;background:#fff}
.action-chip:hover{background:#f1f5f9}
.action-chip.active{background:#1a365d;color:#fff;border-color:#1a365d}

input[type=checkbox]{width:15px;height:15px;accent-color:#1a365d;cursor:pointer}

/* Context-aware action ribbon */
.ctx-ribbon{background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:8px 14px;margin:8px 0;display:flex;align-items:center;gap:10px;font-size:.82em}
.ctx-ribbon .ctx-ic{font-size:1.2em}
.ctx-ribbon .ctx-msg{flex:1;color:#92400e}
.ctx-ribbon .ctx-actions{display:flex;gap:6px}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="sb">
    <div class="sb-hdr"><h2>GAM</h2><small>Genesis Asset Management</small></div>
    <div class="sb-nav">
      <div class="sb-section">ENRICHMENT</div>
      <button class="sb-item active" data-menu="workspace"><span class="ic">📋</span><span class="lb">Enrichment Workspace</span><span class="sb-badge" id="ws-count">108</span></button>
      <button class="sb-item" data-menu="ready"><span class="ic">✓</span><span class="lb">Ready for Posting</span><span class="sb-badge" id="rdy-count">0</span></button>
      <button class="sb-item" data-menu="queue"><span class="ic">📤</span><span class="lb">Posting Queue</span><span class="sb-badge">0</span></button>
      <button class="sb-item" data-menu="posted"><span class="ic">📗</span><span class="lb">Posted Operations</span><span class="sb-badge">0</span></button>
      <button class="sb-item" data-menu="history"><span class="ic">🔀</span><span class="lb">Split/Merge History</span><span class="sb-badge">0</span></button>
      <div class="sb-section">FUND MANAGEMENT</div>
      <button class="sb-item" data-menu="fund"><span class="ic">📊</span><span class="lb">Fund Allocation</span></button>
      <button class="sb-item" data-menu="nav"><span class="ic">📈</span><span class="lb">NAV Calculation</span></button>
      <button class="sb-item" data-menu="investors"><span class="ic">👥</span><span class="lb">Investor Positions</span></button>
      <div class="sb-section">OTHER</div>
      <button class="sb-item" data-menu="stm"><span class="ic">📁</span><span class="lb">Statements</span></button>
      <button class="sb-item" data-menu="loans"><span class="ic">🏦</span><span class="lb">Loan Contracts</span></button>
      <button class="sb-item" data-menu="mdm"><span class="ic">⚙</span><span class="lb">Master Data</span></button>
    </div>
    <div class="sb-footer">👤 anna.tamm<br>Joget DX 8.1</div>
  </div>

  <div class="main">
    <div class="top-bar">
      <div><h1 id="page-title">Enrichment Workspace <span class="version">v2.0</span></h1><div class="stm-filter hidden" id="stm-filter">Filtered: <span id="stm-filter-val"></span> <a id="stm-clear">Clear</a></div></div>
      <div class="meta">Period: Jun–Aug 2024 &nbsp;·&nbsp; <span id="rec-count">142 records</span> &nbsp;·&nbsp; Loaded in 5ms</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="toast-container"></div>
<div id="overlay-container"></div>
<div id="slide-container"></div>

<script>

function fmt(v){return v!=null&&v!==0?Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):""}
function trc(s,n){n=n||56;return s&&s.length>n?s.slice(0,n)+"…":s}
function stBadge(v){const c=SM_[v]||{b:"#f1f5f9",f:"#64748b"};const cl=(v==="error"||v==="ready"?" bold":"")+(v==="superseded"?" strike":"");return `<span class="st-badge${cl}" style="background:${c.b};color:${c.f}">${(v||"—").replace(/_/g," ")}</span>`;}
function confBadge(v){const c=CM_[v]||{b:"#f1f5f9",f:"#64748b"};return `<span class="conf-badge" style="background:${c.b};color:${c.f}">${(v||"—").replace(/_/g," ")}</span>`;}
function srcBadge(v){const c=v==="S"?{b:"#E3F2FD",f:"#1565C0"}:v==="B"?{b:"#F3E5F5",f:"#6A1B9A"}:{b:"#E0F2F1",f:"#00695C"};return `<span class="src-badge" style="background:${c.b};color:${c.f}">${v}</span>`;}
function typeBadge(v){const cat=TY_CAT[v]||"";return `<span class="type-badge ${cat}">${v||'<span class="missing">—</span>'}</span>`;}
function dcHtml(v){const cls=v==="D"?"dc-d":v==="C"?"dc-c":"dc-n";return `<span class="${cls}">${v}</span>`;}
function amtHtml(v,bold){const neg=v<0;return `<span class="amt${bold?" bold":""}${neg?" neg":""}">${fmt(v)}</span>`;}
function isEditable(st){return["enriched","in_review","adjusted","ready"].includes(st);}
function isLoanType(ty){return["LOAN_PAYMENT","LOAN_DISBURSEMENT","INT_INCOME","INT_EXPENSE"].includes(ty);}
function isFundTrx(r){return r.fund||r.cu==="12345678";}

function showToast(msg){
  const c=document.getElementById("toast-container");

}

document.querySelectorAll(".sb-item").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const m=btn.dataset.menu;if(!m)return;
    currentMenu=m;wsSel=new Set();
    closeSlide();closeOverlay();
    document.querySelectorAll(".sb-item").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const titles={workspace:"Enrichment Workspace",ready:"Ready for Posting",queue:"Posting Queue",posted:"Posted Operations",history:"Split/Merge History",fund:"Fund Allocation",nav:"NAV Calculation",investors:"Investor Positions",stm:"Statements",loans:"Loan Contracts",mdm:"Master Data"};
    document.getElementById("page-title").innerHTML=(titles[m]||"GAM")+' <span class="version">v2.0</span>';
    render();
  });
});
document.getElementById("stm-clear").addEventListener("click",()=>{stmFilter=null;render();});

function render(){
  const sf=document.getElementById("stm-filter");
  if(stmFilter){sf.classList.remove("hidden");document.getElementById("stm-filter-val").textContent=stmFilter;}else{sf.classList.add("hidden");}
  const c=document.getElementById("content");
  if(currentMenu==="workspace")renderWorkspace(c);
  else if(currentMenu==="ready")renderReady(c);
  else if(currentMenu==="fund")renderFundAlloc(c);
  else if(currentMenu==="nav")renderNAV(c);
  else if(currentMenu==="investors")renderInvestors(c);
  else if(currentMenu==="loans")renderLoans(c);
  else if(currentMenu==="queue")c.innerHTML=`<div class="placeholder"><div class="big-icon">📤</div><p>No operations in posting queue</p></div>`;
  else if(currentMenu==="posted")c.innerHTML=`<div class="placeholder"><div class="big-icon">📗</div><p>No posted operations yet — confirm transactions from the workspace first</p></div>`;
  else if(currentMenu==="history")c.innerHTML=`<div class="placeholder"><div class="big-icon">🔀</div><p>Split/Merge history will appear here after operations are performed</p></div>`;
  else if(currentMenu==="stm")c.innerHTML=`<div class="placeholder"><div class="big-icon">📁</div><p>Statements — links to Enrichment Workspace via filters</p></div>`;
  else if(currentMenu==="mdm")c.innerHTML=`<div class="placeholder"><div class="big-icon">⚙</div><p>Master Data: Customers, Assets, Counterparties, FX Rates, Transaction Types</p></div>`;
}

function renderWorkspace(c){
  const sr=WS.filter(r=>wsSel.has(r.id));
  let h="";

  // Summary cards
  const enriched=WS.filter(r=>r.st==="enriched").length;
  const paired=WS.filter(r=>r.st==="paired").length;
  const loanTrx=WS.filter(r=>isLoanType(r.ty)).length;
  const fundTrx=WS.filter(r=>isFundTrx(r)).length;
  const needsAttn=WS.filter(r=>r.cu==="UNK"||!r.cu).length;

  // Mini-summary shown when collapsed
  const miniSummary=`<div class="st-mini">
    <span><span class="dot" style="background:#1a365d"></span>${WS.length} records</span>
    <span><span class="dot" style="background:#16a34a"></span>100% auto</span>
    <span><span class="dot" style="background:#92400e"></span>${loanTrx} loan</span>
    <span><span class="dot" style="background:#1e40af"></span>${fundTrx} fund</span>

  h+=`<div class="summary">
    <button class="summary-toggle" onclick="summaryCollapsed=!summaryCollapsed;render()">

    <div class="summary-inner${summaryCollapsed?" collapsed":""}">`;

  h+=`<div class="summary-cards">

    <div class="s-card"><div class="s-label">Fund Transactions</div><div class="s-val">${fundTrx}</div><div class="s-sub">Customer 12345678 — needs allocation</div></div>
    ${needsAttn>0?`<div class="s-card amber"><div class="s-label">Needs Attention</div><div class="s-val">${needsAttn}</div><div class="s-sub">Missing/unknown customer</div></div>`:""}

    STMTS.forEach(s=>{h+=`<tr class="clickable" onclick="event.stopPropagation();stmFilter='${s.id}';render()">

      <td class="c">${srcBadge(s.src==="bank"?"B":"S")}</td>
      <td class="r" style="font-weight:600">${s.total}</td>
      <td class="r"><span style="color:${s.enriched>0?"#2E7D32":"#94a3b8"}">${s.enriched}</span></td>
      <td class="r"><span style="color:${s.paired>0?"#283593":"#94a3b8"}">${s.paired}</span></td>
      <td class="r"><span style="color:${s.ready>0?"#1B5E20":"#94a3b8"};font-weight:${s.ready>0?600:400}">${s.ready}</span></td>

      <td class="r"><span style="color:${s.err>0?"#C62828":"#94a3b8"};font-weight:${s.err>0?700:400}">${s.err>0?"⚠ "+s.err:s.err}</span></td>
    </tr>`;});
    h+=`</tbody></table><div class="summary-hint">Click a statement row to filter the workspace below</div>`;
  }
  h+=`</div></div>`;

  // Toolbar with grouped operations
  const canConf=sr.some(r=>r.st==="ready");

  h+=`<div class="toolbar">

    <tr><td style="font-weight:600">Principal</td><td>${typeBadge("LOAN_PAYMENT")}</td><td class="r"><input value="${fmt(principal)}" style="width:100px;text-align:right;font-size:.86em;padding:3px;border:1px solid #e2e8f0;border-radius:4px;font-family:monospace"></td><td class="r muted">—</td><td>—</td></tr>

    <div class="split-sum"><div>Sum: <strong>${fmt(Math.abs(r.to))}</strong></div><span class="green">Remaining: 0.00 ✓</span></div>

// ─── FORM SLIDE-OVER ───────────────────────────────────────────────────────
function openForm(id){
  const r=WS.find(x=>x.id===id);if(!r)return;
  const ed=isEditable(r.st);
  const loan=r.lo?LOANS.find(l=>l.id===r.lo):null;

  function fld(label,val,opts){
    opts=opts||{};
    const cls=opts.wide?"f-field wide":"f-field";
    let inner;
    if(opts.badge){const c=SM_[val]||CM_[val]||{b:"#f1f5f9",f:"#64748b"};inner=`<span class="st-badge" style="background:${c.b};color:${c.f}">${(val||"").replace(/_/g," ")}</span>`;}
    else if(opts.dc){inner=`<span class="${val==="D"?"dc-d":val==="C"?"dc-c":"dc-n"}">${val==="D"?"D (Debit)":val==="C"?"C (Credit)":"N (Neutral)"}</span>`;}
    else if(opts.typeBadge){inner=typeBadge(val);}
    else if(opts.err){inner=`<div class="err-val">${val}</div>`;}
    else if(opts.editable){inner=`<input type="text" value="${val||""}" placeholder="${opts.ph||""}" class="${opts.highlight?"highlight":""}${opts.mono?" mono":""}" style="${opts.mono?"font-family:monospace;":""}">`;}
    else{inner=`<div class="val${opts.muted?" muted":""}${opts.mono?" mono":""}" style="${opts.bold?"font-weight:700;":""}">${val||"—"}</div>`;}
    return `<div class="${cls}"><label>${label}</label>${inner}</div>`;
  }
  function sec(title,n,content,show){
    if(show===false)return"";
    return `<div class="f-section"><button class="f-section-hdr" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.querySelector('.toggle').textContent=this.nextElementSibling.style.display==='none'?'▸':'▾'"><span class="num">§${n}</span><span class="title">${title}</span><span class="toggle">▾</span></button><div class="f-section-body">${content}</div></div>`;
  }

  // Context-aware action ribbon
  let ribbon="";
  if(isLoanType(r.ty)&&!r.lo){ribbon=`<div class="ctx-ribbon"><span class="ctx-ic">⚠</span><span class="ctx-msg">Loan transaction not linked to a contract</span><div class="ctx-actions"><button class="btn xs primary" onclick="closeSlide();wsSel=new Set(['${r.id}']);openLinkLoanDlg()">Link Contract</button></div></div>`;}
  if(isLoanType(r.ty)&&r.lo&&r.ty==="LOAN_PAYMENT"){ribbon+=`<div class="ctx-ribbon" style="background:#eff6ff;border-color:#bfdbfe"><span class="ctx-ic">💡</span><span class="ctx-msg" style="color:#1e40af">This payment can be split into principal + interest</span><div class="ctx-actions"><button class="btn xs primary" onclick="closeSlide();wsSel=new Set(['${r.id}']);openLoanSplitDlg()">Loan Split</button></div></div>`;}
  if(isFundTrx(r)&&r.st!=="paired"){ribbon+=`<div class="ctx-ribbon" style="background:#eff6ff;border-color:#bfdbfe"><span class="ctx-ic">📊</span><span class="ctx-msg" style="color:#1e40af">Fund transaction — allocate to investors</span><div class="ctx-actions"><button class="btn xs primary" onclick="closeSlide();wsSel=new Set(['${r.id}']);openFundAllocDlg()">Allocate</button></div></div>`;}
  if(r.cu==="UNK"){ribbon+=`<div class="ctx-ribbon"><span class="ctx-ic">⚠</span><span class="ctx-msg">Customer is unknown — needs reassignment</span><div class="ctx-actions"><button class="btn xs warn" onclick="closeSlide();wsSel=new Set(['${r.id}']);openReassignDlg()">Reassign</button></div></div>`;}

  // Operation bar
  let opBar=`<div class="op-bar">`;
  if(ed){
    opBar+=`<button class="op-btn" onclick="closeSlide();wsSel=new Set(['${r.id}']);openReclassifyDlg()"><span class="op-ic">🏷</span> Reclassify</button>`;
    opBar+=`<button class="op-btn" onclick="closeSlide();wsSel=new Set(['${r.id}']);openReassignDlg()"><span class="op-ic">👤</span> Reassign</button>`;
    opBar+=`<button class="op-btn" onclick="closeSlide();wsSel=new Set(['${r.id}']);openSplitDlg()"><span class="op-ic">⑂</span> Split</button>`;
    if(isLoanType(r.ty))opBar+=`<button class="op-btn highlight" onclick="closeSlide();wsSel=new Set(['${r.id}']);openLoanSplitDlg()"><span class="op-ic">🏦</span> Loan Split</button>`;
    if(isFundTrx(r))opBar+=`<button class="op-btn highlight" onclick="closeSlide();wsSel=new Set(['${r.id}']);openFundAllocDlg()"><span class="op-ic">📊</span> Fund Alloc</button>`;
    if(r.cy!=="EUR")opBar+=`<button class="op-btn" onclick="closeSlide();wsSel=new Set(['${r.id}']);openFxOverrideDlg()"><span class="op-ic">💱</span> FX Override</button>`;
  }
  opBar+=`</div>`;

  let body=ribbon+opBar;

  // Sections
  body+=sec("Traceability","1",`<div class="f-row">${fld("Source Type",r.s==="S"?"Securities":r.s==="B"?"Bank":"Manual")}${fld("Enrichment ID",r.id,{mono:true})}${fld("Statement","STM-2024-07",{muted:true})}</div>`);

  body+=sec("Transaction","2",`<div class="f-row">${fld("Transaction Date",r.dt,{editable:ed})}${fld("Settlement Date","",{editable:ed,ph:"T+2"})}${fld("D/C",r.dc,{dc:true})}</div><div class="f-row">${fld("Amount",fmt(r.am),{mono:true,editable:ed})}${fld("Fee",fmt(r.fe),{mono:true,editable:ed})}${fld("Total",fmt(r.to),{mono:true,bold:true})}</div><div class="f-row">${fld("Description",r.de,{wide:true,editable:ed})}</div>`);

  body+=sec("Classification","3",`<div class="f-row">${fld("Internal Type",r.ty,{typeBadge:true})}${fld("Confidence",r.co,{badge:true})}${fld("Matched Rule","R-"+r.ty+"-001",{muted:true})}</div>`);

  body+=sec("Currency & FX","4",`<div class="f-row">${fld("Currency",r.cy)}${fld("FX Rate to EUR",r.cy==="EUR"?"1.000000":"1.068380",{mono:true,editable:r.cy!=="EUR"&&ed})}${fld("Rate Source",r.cy==="EUR"?"—":"ECB")}</div><div class="f-row">${fld("EUR Amount",fmt(r.cy==="EUR"?Math.abs(r.to):Math.abs(r.to)/1.0684),{mono:true,bold:true})}</div>`);

  body+=sec("Resolved Entities","5",`<div class="f-row">${fld("Customer ID",r.cu,{editable:ed,highlight:!r.cu||r.cu==="UNK"})}${fld("Match Method","pipeline",{muted:true})}</div><div class="f-row">${fld("Asset ID",r.as||"",{editable:ed})}${fld("Counterparty",r.cp||"",{editable:ed})}</div>`);

  // Loan section (conditional)
  if(loan){
    body+=sec("Loan Contract","6",`
      <div class="contract-card" style="margin:0">
        <div class="cc-hdr"><div class="cc-title">🔗 ${loan.id}</div><span class="st-badge" style="background:#E8F5E9;color:#2E7D32">active</span></div>
        <div class="cc-grid">
          <div class="cc-field"><div class="cc-lbl">Customer</div><div class="cc-val">${loan.customer}</div></div>
          <div class="cc-field"><div class="cc-lbl">Outstanding</div><div class="cc-val">${fmt(loan.outstanding)} ${loan.currency}</div></div>
          <div class="cc-field"><div class="cc-lbl">Rate</div><div class="cc-val">${loan.rate}% (${loan.basis})</div></div>
        </div>
      </div>
    `);
  }

  // Fund allocation status (conditional)
  if(isFundTrx(r)&&r.st!=="paired"){
    body+=sec("Fund Allocation","7",`<div class="info-box warn"><strong>Not yet allocated</strong> — this transaction needs to be distributed to ${INVESTORS.length} investors proportionally.</div>
      <button class="btn sm primary" onclick="closeSlide();wsSel=new Set(['${r.id}']);openFundAllocDlg()">Allocate to Investors</button>`);
  }

  // Status & Notes
  let s8=`<div class="f-row">${fld("Status",r.st,{badge:true})}${fld("Origin",r.or)}${fld("Version","1",{muted:true})}</div>`;
  s8+=`<div class="f-row">${fld("Processing Notes","",{wide:true,editable:true,ph:"Add notes about this record..."})}</div>`;
  body+=sec("Status & Notes","8",s8);

  // Footer buttons
  let leftBtns="";
  if(ed)leftBtns+=`<button class="btn primary" onclick="closeSlide();showToast('Record saved')">Save</button>`;
  leftBtns+=`<button class="btn" onclick="closeSlide()">Close</button>`;
  let rightBtns="";
  if(["enriched","adjusted","in_review","paired"].includes(r.st))rightBtns+=`<button class="btn sm success" onclick="closeSlide();showToast('Marked as ready')"><span class="ic">→</span> Mark Ready</button>`;
  if(r.st==="ready")rightBtns+=`<button class="btn sm" onclick="closeSlide();showToast('Returned to editing')"><span class="ic">↩</span> Return</button>`;

  document.getElementById("slide-container").innerHTML=`<div class="slide-over">
    <div class="slide-bg" onclick="closeSlide()"></div>
    <div class="slide-panel">
      <div class="slide-hdr"><div><div class="meta">Enrichment Record</div><h2>${r.id} <span style="margin-left:8px">${typeBadge(r.ty)}</span></h2></div><div style="display:flex;gap:7px;align-items:center">${stBadge(r.st)}<button class="dlg-close" onclick="closeSlide()">×</button></div></div>
      <div class="slide-body">${body}</div>
      <div class="slide-footer"><div style="display:flex;gap:7px">${leftBtns}</div><div style="display:flex;gap:7px">${rightBtns}</div></div>
    </div>
  </div>`;
}

// ─── INIT ──────────────────────────────────────────────────────────────────
render();
</script>
